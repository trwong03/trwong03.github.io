<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Detector — Live Demo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../../style.css?v=18">
  <script src="../../theme.js?v=7"></script>
  <style>
    /* Fill the iframe; any extra height goes above the button row */
    body { background: var(--surface); padding: 16px; min-height: 100vh; display: flex; }
    main { flex: 1; display: flex; flex-direction: column; padding: 0; }
    main .row { margin-top: auto; padding-top: 12px; }
    .demo-grid { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: start; }
    canvas { display: block; width: 192px; height: 192px; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px; touch-action: none; cursor: crosshair; }
    .hint { font-size: 14px; color: var(--muted); margin: 8px 0 0; max-width: 192px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { min-height: 44px; padding: 0 14px; font-size: 15px; border: 0; cursor: pointer; font-family: inherit; }
    .btn.ghost { border: 1px solid var(--line); }
    .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
    li { font: 14px var(--mono); display: grid; grid-template-columns: 2.5em 1fr auto; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }
    li.pass { border-color: var(--accent); color: var(--text); }
    li.pass b { color: var(--accent); }
    li.fail { border-color: var(--accent-2); color: var(--text); }
    li.fail b { color: var(--accent-2); }
    #verdict { font: 500 20px var(--mono); margin: 12px 0 0; }
    /* Instant hover/focus hint above each button (native title tooltips are slow) */
    .row .btn { position: relative; }
    .row .btn[data-tip]:is(:hover, :focus-visible)::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 1; white-space: nowrap; font: 12px var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; pointer-events: none; }
    .row .btn[data-tip]:last-child::after { left: auto; right: 0; }
    @media (max-width: 480px) { .demo-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="content">
    <div class="demo-grid">
      <div>
        <canvas id="img" width="24" height="24" aria-label="24 by 24 pixel test image. Drag to paint on it."></canvas>
        <p class="hint">A real 24×24 face from the MIT CBCL set. Drag to paint on it.</p>
      </div>
      <div>
        <ol id="stages"></ol>
        <p id="verdict" role="status"></p>
      </div>
    </div>
    <div class="row">
      <button class="btn ghost" id="dark" data-tip="Brush paints dark pixels" aria-pressed="true">Paint dark</button>
      <button class="btn ghost" id="light" data-tip="Brush paints light pixels" aria-pressed="false">Paint light</button>
      <button class="btn ghost" id="invert" data-tip="Swap dark and light pixels">Invert</button>
      <button class="btn ghost" id="blank" data-tip="Clear to a flat gray image">Blank</button>
      <button class="btn" id="reset" data-tip="Restore the original face">Reset</button>
    </div>
  </main>

  <script>
    // The team's trained cascade (config-7: 4 strong / 58 weak classifiers), copied from
    // data/strong-configs/config-7. First line "<num weak> <stage threshold>", then one
    // "<type> <x> <y> <w> <h> <threshold> <polarity> <alpha>" line per weak classifier.
    const STAGES = [
      `2 1
1 10 4 2 9 -81 1 1.85565804
0 5 5 2 6 145 -1 1.57597507`,
      `14 5
0 18 4 5 8 617 -1 1.26746679
0 7 19 2 4 21 -1 1.17886075
0 7 0 9 4 -414 1 1.13431826
1 15 12 6 1 -20 1 1.04107848
4 0 1 2 6 -13 1 0.99479834
0 18 22 6 2 -3 1 0.93753234
0 11 10 1 6 -42 1 0.95580835
0 16 0 8 2 107 -1 1.05352349
1 13 1 2 10 65 -1 1.02523399
4 0 0 2 2 -5 1 0.79418987
0 6 5 2 4 29 -1 0.91975783
4 10 0 2 8 20 -1 0.88917040
2 3 3 20 9 -10243 1 0.83873593
1 4 9 4 6 31 -1 0.97467269`,
      `41 18
1 0 0 10 1 -109 1 0.98089700
0 21 13 3 2 -5 1 0.95932224
1 0 22 6 2 -48 1 1.02863436
0 15 19 3 4 21 -1 0.99126217
0 14 6 7 2 53 -1 0.97037788
0 11 10 4 2 4 -1 0.92136293
4 14 0 10 2 41 -1 0.87308597
4 5 12 14 12 -478 -1 0.89860351
2 20 1 1 12 -878 1 0.93215003
1 22 12 2 1 1 -1 0.97160945
0 21 21 1 2 -2 1 0.88831901
4 10 6 2 18 -70 1 0.81790398
0 12 14 2 4 30 -1 0.89400662
0 6 9 2 12 -82 1 0.95687247
4 6 9 2 4 -7 1 0.82640176
2 3 3 11 9 -2910 -1 0.86654008
0 7 9 6 2 -10 -1 0.99423871
0 22 11 2 10 -75 1 0.90201634
0 14 14 1 2 5 -1 0.91604625
0 7 14 10 2 -80 1 0.89976233
4 1 11 22 6 308 1 0.93770711
4 0 6 2 2 3 -1 0.78352262
4 6 9 14 10 -299 -1 0.91149750
4 0 0 4 2 -18 1 0.83390846
1 15 7 8 8 -58 1 0.84140147
4 7 14 2 4 6 -1 0.87177359
4 1 1 4 8 -3 1 0.88985839
0 1 22 2 2 -3 1 0.84600571
0 16 19 1 2 3 -1 0.87698786
1 5 9 2 2 21 1 0.85697955
0 12 14 5 2 -71 1 0.85681389
1 4 12 4 1 10 -1 0.85598230
1 14 7 4 1 6 1 0.84574017
0 13 7 7 2 22 -1 0.86283164
0 9 13 5 4 100 -1 0.91009982
4 3 20 6 4 18 -1 0.88579274
1 13 4 2 20 105 -1 0.79633998
4 14 22 6 2 -3 1 0.85904834
1 10 6 2 1 -20 1 0.92029472
0 7 3 1 10 64 -1 0.95613182
0 4 4 3 2 29 -1 0.90974316`,
      `1 23
1 13 0 8 14 -1447 -1 23.02585093`
    ];
    const FACE = [
      104,115,131,147,158,161,158,161,169,176,183,185,182,170,149,140,124,111,109,120,109,102,95,84,
      95,104,117,128,132,125,118,124,138,144,155,165,167,149,108,100,101,97,88,85,82,83,86,89,
      90,94,97,102,107,94,84,90,107,121,125,154,159,123,83,84,88,87,82,79,76,79,84,85,
      89,87,79,86,109,85,80,85,96,113,109,148,151,109,91,103,115,105,82,83,78,83,87,81,
      86,77,68,88,132,91,95,104,100,101,104,132,136,112,108,124,164,146,71,60,64,74,83,89,
      95,73,72,91,106,104,108,102,92,96,97,128,138,113,90,101,127,125,93,86,77,72,78,91,
      97,87,83,88,96,106,108,100,95,104,97,128,141,114,79,84,98,104,101,100,93,88,88,94,
      111,103,97,100,108,112,114,110,109,118,101,125,136,111,85,88,99,110,116,114,114,106,98,98,
      133,115,111,122,130,130,133,128,122,126,103,122,130,108,95,102,115,129,137,131,131,118,105,107,
      142,125,123,136,146,154,156,140,122,121,101,124,135,113,91,107,119,133,147,144,138,124,115,121,
      137,141,139,141,155,158,158,145,127,115,99,132,146,117,87,109,130,142,151,158,154,140,128,127,
      132,137,141,147,159,162,168,160,136,109,105,146,156,119,91,115,143,157,158,159,155,144,132,129,
      126,132,138,145,154,160,175,173,143,102,111,157,167,128,95,114,153,171,161,155,150,140,129,124,
      119,130,135,137,144,149,169,173,145,97,104,148,163,131,94,107,152,174,160,154,145,134,124,117,
      117,125,131,134,138,143,154,160,143,97,85,108,119,103,88,103,132,156,161,154,140,132,126,119,
      121,127,130,133,142,152,153,149,134,104,92,100,109,102,85,95,112,128,144,154,143,134,127,119,
      116,124,127,131,141,145,135,120,108,100,103,109,114,111,97,93,96,104,115,128,134,132,124,114,
      106,117,125,130,134,124,109,99,98,107,121,128,128,124,115,100,95,93,93,102,119,128,120,105,
      96,111,124,129,123,103,94,95,105,118,131,136,134,127,117,102,95,90,84,94,110,124,118,95,
      91,104,120,124,113,100,90,81,77,83,93,105,105,93,80,71,66,68,77,90,116,126,111,85,
      94,96,110,122,116,96,87,79,71,69,81,90,91,86,82,79,91,102,101,102,129,131,105,78,
      93,88,101,120,123,102,97,95,92,89,100,106,105,102,103,95,110,122,114,109,132,126,98,75,
      85,84,94,109,115,108,113,117,115,112,118,119,117,114,113,109,115,120,116,108,121,112,89,73,
      75,84,89,91,96,107,125,129,121,115,113,110,109,109,105,119,116,114,117,104,108,98,81,71
    ]; // test/actor/test01/0001.txt, row-major grayscale
    const N = 24;

    const cascade = STAGES.map((txt) => {
      const [head, ...lines] = txt.trim().split("\n");
      return { threshold: +head.split(" ")[1], weak: lines.map((l) => l.split(" ").map(Number)) };
    });

    // Rectangles with +1/-1 weights per Haar feature type, as in classifier.cpp CONFIGURE
    function rects(t, x, y, w, h) {
      const w2 = w / 2 | 0, h2 = h / 2 | 0, w3 = w / 3 | 0, h3 = h / 3 | 0;
      return [
        [[x, y, w, h2, -1], [x, y + h2, w, h2, 1]],
        [[x, y, w2, h, 1], [x + w2, y, w2, h, -1]],
        [[x, y, w, h3, -1], [x, y + h3, w, h3, 1], [x, y + 2 * h3, w, h3, -1]],
        [[x, y, w3, h, -1], [x + w3, y, w3, h, 1], [x + 2 * w3, y, w3, h, -1]],
        [[x, y, w2, h2, 1], [x + w2, y, w2, h2, -1], [x, y + h2, w2, h2, -1], [x + w2, y + h2, w2, h2, 1]],
      ][t];
    }

    // Same math as classifier_classify.cpp: integral image, weak votes, alpha-weighted sum vs stage threshold
    function classify(px) {
      const ii = Array.from({ length: N + 1 }, () => new Float64Array(N + 1));
      for (let y = 0; y < N; y++) {
        let row = 0;
        for (let x = 0; x < N; x++) { row += px[y * N + x]; ii[y + 1][x + 1] = ii[y][x + 1] + row; }
      }
      const sum = (x, y, w, h) => ii[y + h][x + w] - ii[y][x + w] - ii[y + h][x] + ii[y][x];
      const results = [];
      for (const s of cascade) {
        let score = 0;
        for (const [t, x, y, w, h, th, p, a] of s.weak) {
          const f = rects(t, x, y, w, h).reduce((acc, [rx, ry, rw, rh, wt]) => acc + wt * sum(rx, ry, rw, rh), 0);
          if (p * f < p * th) score += a;
        }
        results.push({ score, pass: score >= s.threshold });
        if (score < s.threshold) break; // rejected: later stages never run
      }
      return results;
    }
    // Self-check: the unedited face passes every stage, a blank image fails stage 1
    console.assert(classify(FACE).length === 4 && classify(FACE).every((r) => r.pass), "face should pass");
    console.assert(!classify(FACE.map(() => 128))[0].pass, "blank should be rejected");

    const $ = (id) => document.getElementById(id);
    const ctx = $("img").getContext("2d");
    const frame = ctx.createImageData(N, N);
    let px = FACE.slice(), brush = 20;

    function update() {
      px.forEach((v, i) => frame.data.set([v, v, v, 255], i * 4));
      ctx.putImageData(frame, 0, 0);
      const r = classify(px);
      $("stages").innerHTML = cascade.map((s, i) => {
        const res = r[i];
        if (!res) return `<li><span>S${i + 1}</span><span>${s.weak.length} weak · not run</span><b></b></li>`;
        return `<li class="${res.pass ? "pass" : "fail"}"><span>S${i + 1}</span><span>${s.weak.length} weak · ${res.score.toFixed(2)} ${res.pass ? "≥" : "<"} ${s.threshold}</span><b>${res.pass ? "pass" : "reject"}</b></li>`;
      }).join("");
      $("verdict").textContent = r[r.length - 1].pass ? "Face detected" : `Rejected at S${r.length}`;
    }

    // Paint a 2x2 brush under the pointer
    function paint(e) {
      const b = e.target.getBoundingClientRect();
      const x = Math.floor((e.clientX - b.left) / b.width * N), y = Math.floor((e.clientY - b.top) / b.height * N);
      for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
        const cx = x + dx, cy = y + dy;
        if (cx >= 0 && cx < N && cy >= 0 && cy < N) px[cy * N + cx] = brush;
      }
      update();
    }
    $("img").addEventListener("pointerdown", (e) => { e.target.setPointerCapture(e.pointerId); paint(e); });
    $("img").addEventListener("pointermove", (e) => { if (e.buttons) paint(e); });

    const setBrush = (v) => { brush = v; $("dark").setAttribute("aria-pressed", v < 128); $("light").setAttribute("aria-pressed", v >= 128); };
    $("dark").onclick = () => setBrush(20);
    $("light").onclick = () => setBrush(230);
    $("invert").onclick = () => { px = px.map((v) => 255 - v); update(); };
    $("blank").onclick = () => { px.fill(128); update(); };
    $("reset").onclick = () => { px = FACE.slice(); update(); };
    update();

    // Give the embedding iframe at least the natural content height (+32 body padding, +2 iframe borders; same origin only)
    const natural = () => document.querySelector(".demo-grid").offsetHeight + document.querySelector(".row").offsetHeight + 34;
    if (frameElement) new ResizeObserver(() => (frameElement.style.minHeight = natural() + "px")).observe($("content"));
  </script>
</body>
</html>
